[project]
name = "ovreplay"
version = "0.1.0"
description = "Record an OpenVINO GPU inference once, replay it over plain OpenCL"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "openvino>=2025.0"]

[project.scripts]
ovreplay-record = "ovreplay.record:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/ovreplay"]

[tool.hatch.build.targets.sdist]
include = ["python/ovreplay", "README.md", "LICENSE-*"]
